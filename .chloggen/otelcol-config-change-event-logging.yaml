# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/otlp)
component: pkg/otelcol

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Log every configuration change event through the Collector's logger, including changes that are applied by a partial reload and changes whose new configuration is rejected.

# One or more tracking issues or pull requests related to the change
issues: [15864]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `Config updated, restart service` and `Config updated, performing partial receiver reload` are now both logged
  at warn level and carry a `source` field (`provider` for a confmap provider watch event, `signal` for an OS
  signal) and, for signals, a `signal` field naming it. Previously a partial receiver reload was logged at info
  level, so it was not recorded when the log level was raised above the default.
  A configuration change whose new configuration cannot be applied is now also logged as a
  `Failed to apply updated configuration` error record, instead of only being printed to stderr.

# Optional: The change log or logs in which this entry should be included.
# e.g. '[user]' or '[user, api]'
# Include 'user' if the change is relevant to end users.
# Include 'api' if there is a change to a library API.
# Default: '[user]'
change_logs: []
